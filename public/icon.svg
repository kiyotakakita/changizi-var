<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#27272a" stroke-width="4" />

  <!-- Tactical Grid Marks -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#27272a" stroke-width="2" stroke-dasharray="4 6" />
  <line x1="256" y1="40" x2="256" y2="76" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="436" x2="256" y2="472" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
  <line x1="40" y1="256" x2="76" y2="256" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
  <line x1="436" y1="256" x2="472" y2="256" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />

  <!-- Viewfinder corners -->
  <path d="M 120 160 L 120 120 L 160 120" fill="none" stroke="#eab308" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 392 160 L 392 120 L 352 120" fill="none" stroke="#eab308" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 120 352 L 120 392 L 160 392" fill="none" stroke="#eab308" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 392 352 L 392 392 L 352 392" fill="none" stroke="#eab308" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Golden Spiral (Smooth approximation) -->
  <path d="M 370 340 A 190 190 0 0 0 180 150 A 117 117 0 0 0 297 267 A 72 72 0 0 0 225 339 A 45 45 0 0 0 270 294 A 28 28 0 0 0 242 266" 
        fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Focal Point (Eye of Spiral) Target -->
  <circle cx="242" cy="266" r="10" fill="none" stroke="#06b6d4" stroke-width="3" />
  <circle cx="242" cy="266" r="3" fill="#eab308" />

  <!-- VAR Badge -->
  <rect x="186" y="70" width="140" height="34" rx="6" fill="#eab308" />
  <text x="256" y="94" fill="#09090b" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="4" text-anchor="middle">VAR • CRITIC</text>

  <!-- Phi symbol & ratio -->
  <text x="256" y="440" fill="#a1a1aa" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="2">φ = 1.618033</text>
</svg>
